{% extends 'base.html' %}{% block content %}<div class="admin-nav"><h1>Products</h1><a href="{{ url_for('admin.dashboard') }}">Dashboard</a><a href="{{ url_for('admin.categories') }}">Categories</a><a href="{{ url_for('admin.orders') }}">Orders</a></div><form class="admin-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Add product</h2><label>Name<input name="name" required></label><label>Description<textarea name="description" required></textarea></label><label>Category<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select></label><label>Price ₹<input name="price" type="number" min="0" step="0.01" required></label><label>Stock<input name="stock_quantity" type="number" min="0" required></label><label>Image<input name="image" type="file" accept=".png,.jpg,.jpeg,.webp"></label><button>Add product</button></form><table><tr><th>Name</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr>{% for product in products %}<tr><td>{{ product.name }}</td><td>₹{{ product.price }}</td><td>{{ product.stock_quantity }}</td><td>{{ product.is_active }}</td><td><form method="post" action="{{ url_for('admin.product_toggle',product_id=product.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>{{ 'Deactivate' if product.is_active else 'Activate' }}</button></form></td></tr>{% endfor %}</table>{% endblock %}
