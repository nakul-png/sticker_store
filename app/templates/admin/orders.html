{% extends 'base.html' %}{% block content %}<div class="admin-nav"><h1>Orders</h1><a href="{{ url_for('admin.dashboard') }}">Dashboard</a></div><table><tr><th>ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th></tr>{% for order in orders %}<tr><td>#{{ order.id }}</td><td>{{ order.customer.name }}<br>{{ order.customer.email }}</td><td>₹{{ order.total_amount }}</td><td>{{ order.payment_status }}</td><td><form method="post" action="{{ url_for('admin.order_status',order_id=order.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="order_status">{% for status in ['pending','confirmed','processing','shipped','delivered','cancelled'] %}<option {% if order.order_status==status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select><button>Save</button></form></td></tr>{% else %}<tr><td colspan="5">No orders yet.</td></tr>{% endfor %}</table>{% endblock %}
