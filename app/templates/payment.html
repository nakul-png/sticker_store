{% extends 'base.html' %}{% block content %}<h1>Secure payment</h1><p>Order #{{ order.id }} · ₹{{ order.total_amount }}</p><button id="pay-button">Pay securely with Razorpay</button><p class="muted">Payment details are collected by Razorpay, not this website.</p>{% endblock %}{% block scripts %}<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>document.getElementById('pay-button').onclick=()=>{const r=new Razorpay({key:'{{ key_id }}',amount:'{{ gateway_order.amount }}',currency:'INR',name:'{{ store_name }}',order_id:'{{ gateway_order.id }}',handler:(x)=>fetch('{{ url_for("checkout.payment_verify") }}',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({...x,local_order_id:'{{ order.id }}',csrf_token:'{{ csrf_token() }}'})}).then(r=>r.json()).then(x=>location=x.redirect||location)});r.open()};</script>{% endblock %}
