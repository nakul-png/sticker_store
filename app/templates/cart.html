{% extends 'base.html' %}{% block content %}<h1>Your cart</h1>{% if rows %}<div class="cart">{% for row in rows %}<div class="cart-row"><div><strong>{{ row.product.name }}</strong><br>₹{{ row.product.price }} each</div><form method="post" action="{{ url_for('cart.update', product_id=row.product.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="quantity" type="number" min="0" max="{{ row.product.stock_quantity }}" value="{{ row.quantity }}"><button>Update</button></form><strong>₹{{ row.line_total }}</strong><form method="post" action="{{ url_for('cart.remove', product_id=row.product.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link">Remove</button></form></div>{% endfor %}</div><p class="total">Subtotal: ₹{{ subtotal }}</p><a class="button" href="{{ url_for('checkout.checkout') }}">Checkout</a>{% else %}<p>Your cart is empty. <a href="{{ url_for('products.listing') }}">Browse stickers</a>.</p>{% endif %}{% endblock %}
