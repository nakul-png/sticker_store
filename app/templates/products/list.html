{% extends 'base.html' %}{% block title %}Shop · {{ store_name }}{% endblock %}{% block content %}<h1>All stickers</h1><form class="filters" method="get"><input name="q" value="{{ q }}" placeholder="Search stickers"><select name="category"><option value="">All categories</option>{% for category in categories %}<option value="{{ category.slug }}" {% if selected_category==category.slug %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select><select name="sort"><option value="newest">Newest</option><option value="price_asc" {% if sort=='price_asc' %}selected{% endif %}>Price: low to high</option><option value="price_desc" {% if sort=='price_desc' %}selected{% endif %}>Price: high to low</option></select><button>Apply</button></form><div class="grid">{% for product in products %}{% include 'products/_card.html' %}{% else %}<p>No stickers match your search.</p>{% endfor %}</div>{% endblock %}
