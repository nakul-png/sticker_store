<article class="card product-card">{% if product.image_url %}<img src="{{ url_for('static', filename=product.image_url) }}" alt="{{ product.name }}">{% else %}<div class="image-placeholder">Sticker</div>{% endif %}<p class="eyebrow">{{ product.category.name }}</p><h3><a href="{{ url_for('products.detail', slug=product.slug) }}">{{ product.name }}</a></h3><p class="price">₹{{ '%.2f'|format(product.price) }}</p><form method="post" action="{{ url_for('cart.add', product_id=product.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button {% if product.stock_quantity < 1 %}disabled{% endif %}>Add to cart</button></form></article>
