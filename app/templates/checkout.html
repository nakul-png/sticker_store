{% extends 'base.html' %}{% block content %}<h1>Checkout</h1><div class="checkout"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Delivery details</h2><label>Name<input name="name" required value="{{ form.get('name','') }}"></label><label>Email<input name="email" type="email" required value="{{ form.get('email','') }}"></label><label>Phone<input name="phone" required value="{{ form.get('phone','') }}"></label><label>Address line 1<input name="address_line1" required value="{{ form.get('address_line1','') }}"></label><label>Address line 2<input name="address_line2" value="{{ form.get('address_line2','') }}"></label><label>City<input name="city" required value="{{ form.get('city','') }}"></label><label>State<input name="state" required value="{{ form.get('state','') }}"></label><label>PIN code<input name="pincode" required value="{{ form.get('pincode','') }}"></label><button>Continue to payment</button></form><aside><h2>Order summary</h2>{% for row in rows %}<p>{{ row.product.name }} × {{ row.quantity }} <span>₹{{ row.line_total }}</span></p>{% endfor %}<p>Shipping <span>₹{{ shipping }}</span></p><p class="total">Total <span>₹{{ total }}</span></p></aside></div>{% endblock %}
